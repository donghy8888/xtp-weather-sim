<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>气温模拟 · 寒潮、台风与四季</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="map-wrap">
  <canvas id="base"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="lines"></canvas>
  <canvas id="dyn"></canvas>
</div>

<header id="top">
  <div id="clock">
    <div id="date-str">载入中…</div>
    <div id="winter-str"></div>
  </div>
  <div id="legend">
    <div id="legend-title">地面气温（℃）</div>
    <canvas id="legend-bar" width="600" height="28"></canvas>
    <div id="legend-ticks"></div>
  </div>
  <div class="seg big-seg" id="main-seg">
    <button data-mode="temp" class="on">🌡 气温</button>
    <button data-mode="wind">💨 风速</button>
  </div>
  <div class="top-btns">
    <button id="btn-layers" class="round" aria-label="显示设置">☰</button>
  </div>
</header>

<div id="status"></div>

<div id="layers" class="panel pop hidden">
  <div class="ph">地图显示</div>
  <div class="seg" id="mode-seg">
    <button data-mode="temp" class="on">气温</button>
    <button data-mode="d24">24小时变温</button>
    <button data-mode="wind">风速</button>
  </div>
  <label class="tg"><input type="checkbox" id="ly-wind" checked><span>风的流动（白色细线）</span></label>
  <label class="tg"><input type="checkbox" id="ly-city" checked><span>城市名</span></label>
  <label class="tg"><input type="checkbox" id="ly-ty" checked><span>台风（自动生成）</span></label>
</div>

<div id="city" class="panel hidden">
  <button class="x" data-close="city">×</button>
  <div class="ch"><b id="city-name">-</b><span id="city-now"></span></div>
  <canvas id="city-chart"></canvas>
  <div class="muted small">从10月1日到现在的气温（℃），虚线为 0℃</div>
</div>

<div id="loading"><div class="spin"></div><div id="load-msg">正在载入地图和冬季天气…</div></div>

<footer id="ctrl">
  <button id="btn-play" class="big" aria-label="播放/暂停">▶</button>
  <div class="speeds" id="speeds">
    <button data-sp="0.5">慢</button>
    <button data-sp="2" class="on">中</button>
    <button data-sp="5">快</button>
    <button data-sp="10">极快</button>
  </div>
  <div id="timeline">
    <input type="range" id="slider" min="0" max="848" step="1" value="0">
    <div id="ticks"></div>
  </div>
  <button id="btn-next" class="txt">换一年</button>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
